name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  format:
    name: Format (clang-format)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check formatting
        working-directory: aurorasync_light_player
        run: git ls-files '*.c' '*.h' | xargs uvx clang-format==23.1.1 --style=file --dry-run -Werror

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    env:
      GITLEAKS_VERSION: 8.30.1
      # From gitleaks_8.30.1_checksums.txt, for gitleaks_8.30.1_linux_x64.tar.gz
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive=gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz
          curl -sSfLO https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c
          tar xzf $archive gitleaks
      - name: Scan the history
        run: ${{ runner.temp }}/gitleaks git --redact -v

  static-analysis:
    name: Static analysis (clang-tidy)
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    env:
      IDF_TOOLCHAIN: clang
      # Findings allowed, from the baseline in docs/quality/. Lower it when you fix some.
      MAX_WARNINGS: 9
    steps:
      - uses: actions/checkout@v5
      - name: Run idf.py clang-check
        shell: bash
        working-directory: aurorasync_light_player/examples/rampup_hold_rampdown
        run: |
          $IDF_PATH/tools/idf_tools.py install esp-clang
          . $IDF_PATH/export.sh
          idf.py set-target esp32c6
          idf.py clang-check --exit-code --include-paths "$(realpath ../..)" \
            --run-clang-tidy-options "-header-filter=aurorasync_light_player/"
          count=$(grep -cE ': (warning|error): .*\[' warnings.txt || true)
          grep -E ': (warning|error): .*\[' warnings.txt || true
          echo "clang-tidy findings: $count (max $MAX_WARNINGS)"
          test "$count" -le "$MAX_WARNINGS"

  test:
    name: Unit tests (${{ matrix.name }})
    runs-on: ubuntu-24.04
    container: espressif/idf:v6.1
    strategy:
      fail-fast: false
      matrix:
        include:
          # QEMU emulates esp32, esp32c3 and esp32s3 only.
          - name: QEMU esp32c3
            target: esp32c3
            marker: qemu
          - name: linux
            target: linux
            marker: host_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Install the ESP-IDF CI requirements
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          uv pip install --python "$(command -v python)" \
            -r $IDF_PATH/tools/requirements/requirements.ci.txt \
            -c $IDF_TOOLS_PATH/espidf.constraints.v6.1.txt
      - name: Build the test app
        shell: bash
        working-directory: aurorasync_light_player
        run: |
          . $IDF_PATH/export.sh
          idf-ci build run -p test_apps -t ${{ matrix.target }} -m ${{ matrix.marker }}
      - name: Run the tests
        shell: bash
        working-directory: aurorasync_light_player
        run: |
          . $IDF_PATH/export.sh
          pytest -m ${{ matrix.marker }} --target ${{ matrix.target }} --junitxml=report.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report-${{ matrix.target }}
          path: aurorasync_light_player/report.xml
      - name: Measure the coverage
        if: matrix.target == 'linux'
        working-directory: aurorasync_light_player
        run: |
          note="src/light_player.c (esp_timer) and src/port/esp/ (LEDC driver) never run on linux"
          mkdir coverage
          uvx gcovr==8.8 --filter src/ --txt --print-summary --html-title "Linux unit tests: $note" \
            --html-details coverage/index.html --cobertura coverage/coverage.xml test_apps
          echo "$note"
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'linux'
        with:
          name: coverage-linux
          path: aurorasync_light_player/coverage/

  build:
    name: Build ${{ matrix.example }} (IDF ${{ matrix.idf }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        example: [basic_blink, rampup_hold_rampdown]
        idf: [v6.1]
    steps:
      - uses: actions/checkout@v5
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: esp32c6
          path: aurorasync_light_player/examples/${{ matrix.example }}
